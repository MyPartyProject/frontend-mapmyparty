<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved palette before the app paints; storage may be blocked.
      (() => {
        let theme = "light";
        try {
          const saved = localStorage.getItem("mapmyparty-theme");
          if (saved === "dark") theme = "dark";
          else if (saved && saved !== "light") localStorage.removeItem("mapmyparty-theme");
        } catch { /* Keep the light default when storage is unavailable. */ }
        document.documentElement.className = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/src/assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiko:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map MyParty</title>
    <meta name="description" content="MapMyParty Project" />
    <meta name="author" content="AK" />

    <meta property="og:description" content="MapMyParty Project" />
    <meta property="og:type" content="website" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
